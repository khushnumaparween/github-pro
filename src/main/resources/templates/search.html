<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
    <h2>Users</h2>

    <div th:each="user : ${users}" class="card">
        <img th:src="${user.avatar_url}" width="50">

        <a th:href="@{/user/{u}(u=${user.login})}">
            <span th:text="${user.login}"></span>
        </a>
    </div>
</div>

</body>
</html>
